name: Build Android Shell APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android-shell/**', '.github/workflows/**']
permissions:
  contents: write
concurrency:
  group: android-vivo-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SHELL_SITE_URL: "https://doremy-float-phone-omega.vercel.app"
      SHELL_KEYSTORE_BASE64: ${{ secrets.SHELL_KEYSTORE_BASE64 }}
      SHELL_KEYSTORE_PASSWORD: ${{ secrets.SHELL_KEYSTORE_PASSWORD || secrets.SHELL_SIGNING_PASSWORD }}
      SHELL_KEY_ALIAS: ${{ secrets.SHELL_KEY_ALIAS || 'doremy' }}
      SHELL_KEY_PASSWORD: ${{ secrets.SHELL_KEY_PASSWORD || secrets.SHELL_SIGNING_PASSWORD }}
      SIGNING_PASSWORD: ${{ secrets.SHELL_SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 36 SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Apply reviewed integration sources when present
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .github/workflows/vivo-integration.patch ]; then
            git apply --check .github/workflows/vivo-integration.patch
            git apply .github/workflows/vivo-integration.patch
          fi
      - name: Restore existing signing when configured
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [ -n "$SHELL_KEYSTORE_BASE64" ]; then
            printf '%s' "$SHELL_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/phone.keystore"
          elif [ -n "$SIGNING_PASSWORD" ]; then
            if [ ! -f android-shell/signing/doremy.keystore.enc ]; then
              git fetch --depth=1 origin release/doremy-apk-1.0.13
              git show FETCH_HEAD:android-shell/signing/doremy.keystore.enc > "$RUNNER_TEMP/phone.keystore.enc"
              openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in "$RUNNER_TEMP/phone.keystore.enc" -out "$RUNNER_TEMP/phone.keystore" -pass env:SIGNING_PASSWORD
            else
              openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in android-shell/signing/doremy.keystore.enc -out "$RUNNER_TEMP/phone.keystore" -pass env:SIGNING_PASSWORD
            fi
          fi
          if [ -s "$RUNNER_TEMP/phone.keystore" ]; then
            echo "SHELL_KEYSTORE_FILE=$RUNNER_TEMP/phone.keystore" >> "$GITHUB_ENV"
          fi
      - name: Compile and build installable APK
        run: gradle -p android-shell --no-daemon compileDebugKotlin assembleDebug
      - name: Verify and package APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp android-shell/app/build/outputs/apk/debug/app-debug.apk release-assets/Doremy-vivoS17-1.0.14.apk
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$SIGNER" verify --verbose release-assets/Doremy-vivoS17-1.0.14.apk
          cd release-assets
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Doremy-vivoS17-1.0.14
          path: release-assets/*
      - name: Save compiled sources to the repository
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .github/workflows/vivo-integration.patch ]; then
            rm .github/workflows/vivo-integration.patch
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add android-shell app components lib styles scripts .github/workflows/vivo-integration.patch
            git commit -m 'Integrate vivo S17 native features and shared settings after successful APK compilation'
            git push origin HEAD:main
          fi
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Publish APK download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          安卓测试包，连接 https://doremy-float-phone-omega.vercel.app。适配 vivo S17 的系统返回和高刷新率；加入感知、设备操作、系统日历、截屏确认、悬浮球、桌面小组件与实时感知扩展。重复能力共用同一个入口。

          新增实时扩展默认关闭，系统权限需在手机上逐项开启。通知/分享摘要只有开启相应开关与前台聊天提供后才随当前聊天发送给已配置的模型。截屏分享先预览确认，设备写操作需逐次确认。睡眠依赖 Health Connect 及其数据源。

          使用已配置的签名；未配置持久签名时为可安装的 Android 调试签名测试包。签名不同时不能覆盖旧包，请勿卸载旧应用来强装；先保留旧版及导出备份。真实 vivo S17 的权限、后台保活及硬件能力仍需本机验证。
          NOTES
          gh release create "v1.0.14-vivo-${GITHUB_RUN_NUMBER}" release-assets/* --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title 'Doremy vivo S17 1.0.14 安卓测试版' --notes-file "$RUNNER_TEMP/notes.md" --prerelease
      - name: Remove temporary signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/phone.keystore" "$RUNNER_TEMP/phone.keystore.enc"
