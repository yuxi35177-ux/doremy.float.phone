name: Remove Android build intermediates from source control
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-android.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep sources and published release assets, untrack generated build output
        shell: bash
        run: |
          set -euo pipefail
          git rm -r --ignore-unmatch --cached android-shell/.gradle android-shell/app/build android-shell/build
          for pattern in '/android-shell/.gradle/' '/android-shell/app/build/' '/android-shell/build/' '/android-shell/local.properties'; do
            if ! grep -Fqx "$pattern" .gitignore; then printf '\n%s\n' "$pattern" >> .gitignore; fi
          done
          git add .gitignore
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Keep Android build caches and compiled outputs out of source control'
            git push origin HEAD:main
          fi
