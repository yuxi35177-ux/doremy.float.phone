name: Publish signed Doremy APK

on:
  push:
    branches: [release/doremy-apk-1.0.13]
    paths: [android-shell/**, .github/workflows/android-release.yml]
  workflow_dispatch:
    inputs:
      site_url:
        description: 要加载的自部署站点地址（https://…）
        type: string
        required: false
      initialize_signing:
        description: 首次创建新签名（无法保证覆盖旧 APK）
        type: boolean
        default: false
  workflow_call:
    inputs:
      site_url:
        type: string
        default: ''
      initialize_signing:
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: doremy-apk-release-1.0.13
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/release/doremy-apk-1.0.13'
    runs-on: ubuntu-latest
    env:
      SHELL_SITE_URL: ${{ inputs.site_url || secrets.SHELL_SITE_URL || vars.SHELL_SITE_URL }}
      SHELL_KEYSTORE_BASE64: ${{ secrets.SHELL_KEYSTORE_BASE64 }}
      SHELL_KEYSTORE_PASSWORD: ${{ secrets.SHELL_KEYSTORE_PASSWORD || secrets.SHELL_SIGNING_PASSWORD }}
      SHELL_KEY_ALIAS: ${{ secrets.SHELL_KEY_ALIAS || 'doremy' }}
      SHELL_KEY_PASSWORD: ${{ secrets.SHELL_KEY_PASSWORD || secrets.SHELL_SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore or initialize persistent signing
        env:
          SIGNING_PASSWORD: ${{ secrets.SHELL_SIGNING_PASSWORD }}
          INITIALIZE_SIGNING: ${{ inputs.initialize_signing }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          KEY="$RUNNER_TEMP/doremy.keystore"
          if [ -n "$SHELL_KEYSTORE_BASE64" ]; then
            printf '%s' "$SHELL_KEYSTORE_BASE64" | base64 --decode > "$KEY"
          elif [ -f android-shell/signing/doremy.keystore.enc ]; then
            test -n "$SIGNING_PASSWORD" || { echo '::error::Set SHELL_SIGNING_PASSWORD in repository Actions secrets'; exit 1; }
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in android-shell/signing/doremy.keystore.enc -out "$KEY" -pass env:SIGNING_PASSWORD
          elif [ "$INITIALIZE_SIGNING" = true ]; then
            test "${#SIGNING_PASSWORD}" -ge 20 || { echo '::error::SHELL_SIGNING_PASSWORD must contain at least 20 characters'; exit 1; }
            keytool -genkeypair -keystore "$KEY" -storetype PKCS12 -storepass:env SIGNING_PASSWORD -keypass:env SIGNING_PASSWORD -alias doremy -keyalg RSA -keysize 3072 -validity 10000 -dname 'CN=Doremy Android'
            openssl enc -aes-256-cbc -salt -pbkdf2 -iter 600000 -in "$KEY" -out "$RUNNER_TEMP/doremy.keystore.enc" -pass env:SIGNING_PASSWORD
            python3 - <<'PYCODE'
          import base64,json,os
          from pathlib import Path
          encrypted=Path(os.environ['RUNNER_TEMP'])/'doremy.keystore.enc'
          payload={'message':'build(android): persist encrypted signing key','branch':os.environ['GITHUB_REF_NAME'],'content':base64.b64encode(encrypted.read_bytes()).decode()}
          (Path(os.environ['RUNNER_TEMP'])/'signing-upload.json').write_text(json.dumps(payload))
          PYCODE
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/android-shell/signing/doremy.keystore.enc" --input "$RUNNER_TEMP/signing-upload.json" --silent
          else
            echo '::error::No persistent signing key. Configure original four signing secrets, or explicitly enable initialize_signing to create a new key.'
            exit 1
          fi
          echo "SHELL_KEYSTORE_FILE=$KEY" >> "$GITHUB_ENV"
      - name: Require the repository's own persistent signing and site settings
        shell: bash
        run: |
          set -euo pipefail
          for name in SHELL_SITE_URL SHELL_KEYSTORE_FILE SHELL_KEYSTORE_PASSWORD SHELL_KEY_ALIAS SHELL_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository setting: $name. No unsigned or temporary-signed APK will be published."
              exit 1
            fi
          done
          python3 - <<'PY'
          import os, urllib.parse
          u = urllib.parse.urlparse(os.environ['SHELL_SITE_URL'])
          if u.scheme != 'https' or not u.hostname or u.hostname.endswith('.invalid') or u.username or u.password:
              raise SystemExit('SHELL_SITE_URL must be a real HTTPS site without embedded credentials')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile and build signed release
        run: gradle -p android-shell --no-daemon compileReleaseKotlin assembleRelease
      - name: Verify APK signature and record checksums
        shell: bash
        run: |
          set -euo pipefail
          APK=android-shell/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$SIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/apk-certificate.txt"
          keytool -exportcert -keystore "$SHELL_KEYSTORE_FILE" -alias "$SHELL_KEY_ALIAS" -storepass:env SHELL_KEYSTORE_PASSWORD -file "$RUNNER_TEMP/expected.der"
          EXPECTED=$(sha256sum "$RUNNER_TEMP/expected.der" | cut -d' ' -f1)
          ACTUAL=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-certificate.txt" | head -1 | tr 'A-F' 'a-f')
          test "$EXPECTED" = "$ACTUAL"
          mkdir -p release-assets
          cp "$APK" release-assets/Doremy-1.0.13-release.apk
          printf 'Signing certificate SHA-256: %s\n' "$ACTUAL" > release-assets/signing-certificate.txt
          cd release-assets
          sha256sum Doremy-1.0.13-release.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Doremy-1.0.13-signed-release
          path: release-assets/*
      - name: Publish testing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          本地模型 API、User 面具独立存档、本地通知、左右返回和桌面性能同步测试版。

          使用本仓库配置的持久签名构建，包名保持 app.floatphone.shell，版本 1.0.13（12）。安装前先导出存档；只有旧 APK 使用相同签名时才能覆盖安装，不要为解决签名不一致而直接卸载旧版。

          前端构建、Kotlin 编译和专项回归已通过，真实手机模型、通知及手势仍待测试。无身份标识的旧通知回复会暂存。未修改云端部署环境。
          NOTES
          gh release create v1.0.13 release-assets/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Doremy 1.0.13 同步测试版' --notes-file "$RUNNER_TEMP/notes.md" --prerelease
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/doremy.keystore" "$RUNNER_TEMP/expected.der"
